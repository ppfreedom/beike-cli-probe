name: beike-cli-probe

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BEIKE_MCP_BASE_URL: http://127.0.0.1:8971/mcp
  BEIKE_MCP_API_KEY: probe-dummy-key
  BEIKE_SKIP_UPDATE_CHECK: "1"
  BEIKE_UPDATE_MANIFEST_URL: http://127.0.0.1:8971/manifest.json
  BEIKE_INSTALL_URL: http://127.0.0.1:8971/install.sh
  BEIKE_SOURCE: probe
  BEIKE_SESSION_ID: probe-session-0001
  BEIKE_EXTERNAL_SESSION_ID: probe-external-0001
  BEIKE_RAW_QUERY: PROBE_RAW_QUERY

jobs:
  probe:
    # macos-14 是 arm64 运行器，与仓库里的 darwin-arm64 二进制架构一致。
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare binaries
        run: |
          set -x
          uname -a
          ls -la bin
          for f in bin/*; do
            chmod +x "$f"
            xattr -dr com.apple.quarantine "$f" || true
            codesign --force --sign - "$f" || true
            file "$f" || true
          done

      - name: Start fake MCP server
        run: |
          mkdir -p capture
          python3 fake_mcp_server.py --port 8971 --capture-dir capture \
            > capture/server-stdout.log 2>&1 &
          python3 - <<'PY'
          import socket, time
          for _ in range(30):
              s = socket.socket()
              s.settimeout(1)
              try:
                  s.connect(("127.0.0.1", 8971))
                  print("server ready")
                  raise SystemExit(0)
              except OSError:
                  time.sleep(1)
              finally:
                  s.close()
          raise SystemExit("server not ready")
          PY

      # 第一轮：动态发现全部叶子命令，逐个注入哨兵值，确认请求键名。
      - name: Discover and probe 0.2.26-test
        continue-on-error: true
        run: |
          python3 probe_cli.py --binary "$PWD/bin/beike_local" --label 0.2.26-test --capture-dir capture

      # 第二轮：针对第一轮暴露的不确定项做单变量实验。
      - name: Targeted experiments
        continue-on-error: true
        run: |
          python3 probe_experiments.py --binary "$PWD/bin/beike_local" --label 0.2.26-test --suite full --capture-dir capture
          python3 probe_experiments.py --binary "$PWD/bin/beike_local_0.2.22" --label 0.2.22 --suite diff --capture-dir capture

      # 第三轮：预约字段细节与上报响应的解析契约。
      - name: Protocol experiments
        continue-on-error: true
        run: |
          rm -rf "$HOME/.beike"
          python3 probe_protocol.py --binary "$PWD/bin/beike_local" --label 0.2.26-test --capture-dir capture

      # 第四轮：会话缓存文件名的构成因子。
      - name: Cache key experiments
        continue-on-error: true
        run: |
          rm -rf "$HOME/.beike"
          python3 probe_cache.py --binary "$PWD/bin/beike_local" --label 0.2.26-test --capture-dir capture

      # 0.2.22 的全量发现放在最后，避免它的握手缓存影响前两步的请求序列。
      - name: Discover and probe 0.2.22
        continue-on-error: true
        run: |
          python3 probe_cli.py --binary "$PWD/bin/beike_local_0.2.22" --label 0.2.22 --capture-dir capture

      - name: Collect diagnostics
        continue-on-error: true
        run: |
          {
            echo "==== ~/.beike 内容 ===="
            find "$HOME/.beike" -type f 2>/dev/null | while read -r f; do
              echo "--- $f"
              head -c 2000 "$f"
              echo
            done
            echo "==== doctor ===="
            ./bin/beike_local doctor 2>&1 || true
            echo "==== doctor after cache removal ===="
            rm -rf "$HOME/.beike"
            ./bin/beike_local doctor 2>&1 || true
            echo "==== env ===="
            ./bin/beike_local env 2>&1 || true
          } | tee capture/diagnostics.txt

      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beike-capture
          path: capture
          retention-days: 5
